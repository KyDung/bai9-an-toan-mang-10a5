<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title"><title id="title">Ứng dụng xin cấp quyền</title><rect width="720" height="410" rx="22" fill="#11253c"/><g font-family="Arial, sans-serif"><text x="32" y="34" font-size="15" font-weight="700" fill="#b0d7ed">ỨNG DỤNG XIN CẤP QUYỀN</text><text x="533" y="34" font-size="14" font-weight="600" fill="#b0d7ed">MÔ PHỎNG</text><rect x="220" y="56" width="280" height="326" rx="26" fill="#eef5fb" stroke="none"/><rect x="238" y="80" width="244" height="46" rx="12" fill="#c2d9e9"/><text x="360" y="109" font-size="17" font-weight="700" fill="#183453" text-anchor="middle">Ảnh Vui — chỉnh sửa ảnh</text><text x="360" y="155" font-size="15" font-weight="600" fill="#244c73" text-anchor="middle">Ứng dụng này muốn truy cập:</text><rect x="246" y="172" width="228" height="42" rx="10" fill="#d9e7f2"/><text x="264" y="199" font-size="15" font-weight="600" fill="#183453">📇 Danh bạ của bạn</text><rect x="246" y="222" width="228" height="42" rx="10" fill="#d9e7f2"/><text x="264" y="249" font-size="15" font-weight="600" fill="#183453">💬 Tin nhắn SMS</text><rect x="246" y="272" width="228" height="42" rx="10" fill="#d9e7f2"/><text x="264" y="299" font-size="15" font-weight="600" fill="#183453">🖼️ Ảnh và phương tiện</text><rect x="246" y="326" width="106" height="38" rx="10" fill="#9fb6c9"/><text x="299" y="350" font-size="14" font-weight="700" fill="#0c1e30" text-anchor="middle">Từ chối</text><rect x="368" y="326" width="106" height="38" rx="10" fill="#5a90c9"/><text x="421" y="350" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Đồng ý</text></g></svg>
