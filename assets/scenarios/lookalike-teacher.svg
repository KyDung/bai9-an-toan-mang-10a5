<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title"><title id="title">Tên tài khoản quen thuộc</title><rect width="720" height="410" rx="22" fill="#11253c"/><g font-family="Arial, sans-serif"><text x="32" y="34" font-size="15" font-weight="700" fill="#b0d7ed">TÊN TÀI KHOẢN QUEN THUỘC</text><text x="533" y="34" font-size="14" font-weight="600" fill="#b0d7ed">MÔ PHỎNG</text><rect x="38" y="57" width="644" height="325" rx="20" fill="#eef5fb" stroke="none"/><circle cx="77" cy="94" r="22" fill="#c2d9e9"/><text x="69" y="102" font-size="24" font-weight="700" fill="#244c73">T</text><text x="114" y="93" font-size="23" font-weight="700" fill="#183453">Thầy giáo</text><text x="114" y="117" font-size="15" font-weight="500" fill="#667c93">Cuộc trò chuyện</text><rect x="65" y="140" width="558" height="100" rx="14" fill="#d9e7f2" stroke="none"/><text x="85" y="173" font-size="23" font-weight="500" fill="#183453">Em chuyển tiền giúp thầy nhé.</text><text x="85" y="207" font-size="23" font-weight="500" fill="#183453">Thầy đang bận, nhắn lại sau.</text><rect x="104" y="260" width="548" height="91" rx="14" fill="#d5eaf2" stroke="none"/><text x="126" y="295" font-size="22" font-weight="500" fill="#183453">Tên và ảnh đại diện giống thầy.</text><text x="126" y="326" font-size="22" font-weight="500" fill="#183453">Em sẽ làm gì?</text></g></svg>